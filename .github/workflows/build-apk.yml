name: Build Reliance Registry Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name 'Reliance_Registry_Calculator_BuildReady*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: extracted/project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp extracted/project/app/build/outputs/apk/debug/app-debug.apk Reliance_Registry_Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reliance-Registry-Calculator-APK
          path: Reliance_Registry_Calculator.apk
          if-no-files-found: error
